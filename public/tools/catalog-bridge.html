<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카탈로그 선택 품목 · 오픈가든 ERP</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{font:15px/1.65 system-ui,sans-serif;color:#203a2c;margin:0;background:#f3f6f1}main{max-width:930px;margin:auto;padding:30px 18px}h1{font-size:26px}p{color:#536357}.card{background:#fff;border:1px solid #dfe5dc;border-radius:10px;padding:22px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #edf0eb;text-align:left;padding:10px 6px;font-size:13px;vertical-align:top}th{color:#5b6a5e}button,a.btn{border:0;border-radius:5px;background:#1f4d33;color:white;padding:11px 18px;cursor:pointer;font:inherit;text-decoration:none;display:inline-block;margin-right:8px;margin-top:14px}.light{background:#eaf1e8;color:#1f4d33;border:1px solid #d1decf}small{color:#667}a{color:#1f4d33}@media(max-width:640px){main{padding:16px 8px}th,td{font-size:12px;padding:9px 3px}}</style></head><body><main><h1>카탈로그 선택 품목</h1><p>선택한 품목은 견적서와 제안서에서 함께 사용합니다. 가격은 ERP에서 확인해주세요.</p><div class="card"><label for="catalog-search">품종·학명·규격 검색</label><input id="catalog-search" style="width:100%;padding:12px;margin:8px 0" placeholder="품종을 검색하세요"><label for="catalog-source">공급처 선택</label><select id="catalog-source" style="width:100%;padding:10px;margin:7px 0"><option value="">전체 공급처</option><option value="국내 농장">국내 농장</option><option value="구근 라인업">기존 구근</option><option value="호게나르드">호게나르드</option><option value="HBM">HBM</option></select><p id="catalog-status">카탈로그 불러오는 중…</p><div id="catalog-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;max-height:55vh;overflow:auto"></div><button type="button" id="catalog-more" hidden style="width:100%;padding:10px;margin-top:12px">더 보기</button><hr><p id="state">선택 품목</p><table><thead><tr><th>품목</th><th>규격</th><th>수량</th><th>식물 번호</th></tr></thead><tbody id="items"></tbody></table><button id="copy">품목 목록 복사</button><a class="btn light" href="/quote" target="_top">견적서로 불러오기</a><a class="btn light" href="/proposal" target="_top">제안서로 불러오기</a><p><small>견적서에서 선택 품목 불러오기를 누르세요. 작성 중인 품목은 확인 후 변경됩니다.</small></p></div></main><script src="/tools/catalog-selection.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows=[];
try{
 const encoded=new URLSearchParams(location.search).get('og_selection')||'';
 rows=(encoded?CatalogSelection.remember(CatalogSelection.decode(encoded)):CatalogSelection.recall()).map(p=>({name:p.kname,size:p.size,qty:p.qty,code:p.plantCode}));
 document.getElementById('state').textContent=rows.length+'개 품목이 준비되었습니다.';
 document.getElementById('items').innerHTML=rows.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.size)}</td><td>${p.qty}</td><td>${esc(p.code)}</td></tr>`).join('');
 history.replaceState(null,'',location.pathname);
}catch(e){document.getElementById('state').textContent=e.message;}
document.getElementById('copy').onclick=async()=>{
 if(!rows.length)return;
 const t=['국명\t규격\t수량\t식물 등록번호',...rows.map(p=>[p.name,p.size,p.qty,p.code].join('\t'))].join('\n');
 try{await navigator.clipboard.writeText(t);document.getElementById('state').textContent='품목 목록을 복사했습니다. 견적서 생성기에서 확인하세요.';}catch(e){prompt('아래 목록을 복사하세요',t);}
};</script><script src="/tools/catalog-picker.js"></script></body></html>
